[workspace]
name = "WaterNetworkAnalysis"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.9,<3.13"
pip = "*"

[pypi-dependencies]
ConservedWaterSearch = ">=0.1.0"
MDAnalysis = ">=2.4.0"
numpy = ">=1.22"
scipy = ">=1.0.0"

[feature.test.pypi-dependencies]
pytest = "*"
ConservedWaterSearch = "==0.4.1"
MDAnalysis = "==2.7.0"
numpy = "==2.4.1"
scipy = "==1.13.1"

[feature.lint.pypi-dependencies]
ruff = "*"

[feature.precommit.pypi-dependencies]
prek = "*"

[feature.build.pypi-dependencies]
build = "*"

[feature.py39.dependencies]
python = "3.9.*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[environments]
py39 = { features = ["py39", "test"] }
py310 = { features = ["py310", "test"] }
py311 = { features = ["py311", "test"] }
py312 = { features = ["py312", "test"] }
lint = { features = ["py312", "lint", "precommit"] }
build = { features = ["py312", "build"] }

[tasks]
pytest = "pytest"
lint = "ruff check ."
format = "ruff format ."
precommit = "prek run --all-files"
