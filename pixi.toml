[workspace]
name = "WaterNetworkAnalysis"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.15"
pip = "*"

[pypi-dependencies]
ConservedWaterSearch = ">=0.1.0"
MDAnalysis = ">=2.4.0"
numpy = ">=1.22"
scipy = ">=1.0.0"

[feature.test.pypi-dependencies]
pytest = "*"
ConservedWaterSearch = "==0.5.0"
MDAnalysis = "==2.10.0"
numpy = "==2.4.1"
scipy = "==1.17.0"

[feature.lint.pypi-dependencies]
ruff = "*"

[feature.precommit.pypi-dependencies]
prek = "*"

[feature.build.pypi-dependencies]
build = "*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
py311 = { features = ["py311", "test"] }
py312 = { features = ["py312", "test"] }
py313 = { features = ["py313", "test"] }
py314 = { features = ["py314", "test"] }
lint = { features = ["py314", "lint", "precommit"] }
build = { features = ["py314", "build"] }

[tasks]
pytest = "pytest"
lint = "ruff check ."
format = "ruff format ."
precommit = "prek run --all-files"
