name: Prek Update

on:
  schedule:
    - cron: "0 0 1 */3 *"
  workflow_dispatch:

jobs:
  prek-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      - name: Run prek update
        run: pixi run -e lint prek update
      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          commit-message: "chore: prek update"
          title: "chore: update pre-commit hooks"
          body: "Automated prek update."
          branch: "automation/prek-update"
          labels: "dependencies"
